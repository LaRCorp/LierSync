name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release -p lier-sync-gui -p lier-sync-cli

      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: liersync-windows-x64
          path: |
            target/release/lier-sync-gui.exe
            target/release/lier-sync-cli.exe
          if-no-files-found: error

      - name: Upload Linux binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: liersync-linux-x64
          path: |
            target/release/lier-sync-gui
            target/release/lier-sync-cli
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk & NDK
        run: |
          cargo install cargo-ndk --locked
          echo "$ANDROID_HOME/ndk/$(ls -1 $ANDROID_HOME/ndk | sort -V | tail -n 1)" >> $GITHUB_ENV

      - name: Build Rust Android libraries
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
          ANDROID_NDK_HOME="$NDK_DIR" cargo ndk -t arm64-v8a -t x86_64 -o mobile/app/src/main/jniLibs build -p lier-sync-android --release

      - name: Build Android Debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Assemble APK
        working-directory: mobile
        run: gradle assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: liersync-android-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
