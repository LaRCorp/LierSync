[workspace]
resolver = "2"
members = [
    "crates/lier-sync-core",
    "crates/lier-sync-cli",
    "crates/lier-sync-gui",
    "crates/lier-sync-android",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
authors = ["LaRevole (LaRCorp)"]
license = "GPL-3.0-only"
repository = "https://github.com/LaRCorp/LierSync"
description = "LierSync — lightweight native P2P file & clipboard sync utility by LaRevole (LaRCorp)"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
dirs = "7.0"
uuid = { version = "1.29", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
socket2 = "0.6"
tracing = "0.1"
clap = { version = "4.6", features = ["derive"] }
arboard = "3.7"
iced = { version = "0.14", features = ["tokio", "svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
rfd = "0.17"
x25519-dalek = { version = "2.0", features = ["getrandom"] }
chacha20poly1305 = { version = "0.10", features = ["alloc", "getrandom"] }
qrcode = { version = "0.14", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Bluetooth", "Win32_Networking_WinSock"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
